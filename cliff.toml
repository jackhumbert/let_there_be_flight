[changelog]
header = """
# Changelog
"""
# template for the changelog body
# https://tera.netlify.app/docs/#introduction
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}\
        - {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}{% if commit.scope %} ({{ commit.scope }}){% endif %} ({{ commit.id | truncate(length=7, end="") }})
    {% endfor %}\
{% endfor %}
### Contributors
{% for author in commits | map(attribute="author.name") | unique %}\
    - {{ author }}
{% endfor %}\n
"""
trim = true

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^doc", group = "Documentation", skip = true },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor", skip = true },
    { message = "^style", group = "Styling", skip = true },
    { message = "^test", group = "Testing", skip = true },
    { message = "^chore", group = "Miscellaneous", skip = true },
    { message = "^ci", group = "CI", skip = true },
    { message = "^build", group = "Build", skip = true },
    { body = ".*security", group = "Security" }
]
# git-cliff 0.10 matches this as a glob (libgit2 tag_names), not a regex;
# the old regex-style "v[0-9]+..." matched no tags at all.
tag_pattern = "v[0-9]*"
# A prerelease tag (v1.2.3-rc.1) is not a version of its own: its commits belong to the release that follows.
# The release workflow names the version itself (--tag) and gives the range from the last full release.
ignore_tags = "-|_"
