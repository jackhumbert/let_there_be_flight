# Let There Be Flight: high-end cars whitelist (optional)
#
# Lets you fly only the expensive cars: the Hypercar and Sport class cars V can
# own, plus anything that costs about 100,000 eddies or more. Every other
# vehicle drives as normal.
#
# Install:
#   1. Copy this file to Cyberpunk 2077/r6/tweaks/ (any file name ending in .yaml works).
#   2. In Mod Settings > Let There Be Flight > General Flight Settings, set
#      Flight Availability to "Whitelist Only".
#   The setting applies live; a change to this file needs a game restart.
#
# Add or remove a car:
#   - One line per vehicle record: Vehicle.<record>.canEnterFlight: true
#     Keep it on one line. The nested form (canEnterFlight indented under
#     Vehicle.<record>:) does not work, TweakXL rejects it as an unknown property.
#   - To remove a car, delete its lines or put a # in front of them.
#   - To add one, remove the # from its lines further down, or add a new line
#     with its record name. The player-ownable records are listed in the game's
#     Vehicle.vehicle_list (and in src/tweaks/vehicles.tweak in the LTBF repo).
#   - A typo in a record name does nothing (no error): check the car in game.
#
# Each car has its own record (the one ending in _player, the car V owns and
# summons) and, on the lines marked "traffic", the records that one inherits
# from. Traffic, gang and quest copies of the model use those, so with them
# listed you can fly any copy of the car you find in the street. To fly only
# your own cars, delete the "traffic" lines. A model shares its traffic records
# between its variants, so each one is listed once, under the first car that
# uses it.
#
# Lines starting with # are left off by default: Executive, Economy and other
# classes under about 100,000 eddies, and bikes.
#
# Class is the in-game vehicle class as the public wikis give it; "family"
# means the wikis list the model but not that variant. Prices are the game's
# own Autofixer prices; "reward" means the car is not sold.
#
# Record names are from the game's own tweak sources (Vehicle.vehicle_list and
# the vehicle records, Phantom Liberty and the 2.x cars included) and were
# checked against the shipped TweakDB.

