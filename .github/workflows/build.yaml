name: Build Workflow
on: [ push, pull_request ]

jobs:
  build:
    name: Build (${{ matrix.config }})
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # read access to the private repo holding the game's Oodle dll, which packing the archive needs
      # (not redistributable); missing on pull requests from forks, which then build without the archive
      CI_ASSETS_TOKEN: ${{ secrets.CI_ASSETS_TOKEN }}

    strategy:
      matrix:
        config: [ Debug, RelWithDebInfo ]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0
    - uses: ilammy/msvc-dev-cmd@v1.12.1
      with:
        arch: amd64

    - name: The repo stands alone (no private tooling, sessions or machine paths)
      run: python tools/maintenance/check_public.py

    - name: Fetch the Oodle dll
      if: env.CI_ASSETS_TOKEN != ''
      uses: actions/checkout@v4
      with:
        repository: jackhumbert/cp2077-ci-assets
        token: ${{ env.CI_ASSETS_TOKEN }}
        path: ci_assets

    - name: Configure CMake
      run: |
        $oodle = "${{ github.workspace }}/ci_assets/oo2ext_7_win64.dll"
        $pack = if (Test-Path $oodle) { "-DLTBF_OODLE_DLL=$oodle" } else { "-ULTBF_OODLE_DLL" }
        cmake -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_CI_BUILD=ON -DGITHUB_ENV="$env:GITHUB_ENV" $pack -G Ninja

    - name: Build
      id: build
      run: cmake --build ${{ github.workspace }}/build --config ${{ matrix.config }}

    - name: Unit tests
      run: ctest --test-dir ${{ github.workspace }}/build --output-on-failure

    - name: Get short SHA
      run: echo "SHORT_SHA=$("${{ github.sha }}".SubString(0, 7))" >> $env:GITHUB_ENV

    - name: Create environment variables
      run: |
        $config = "${{ matrix.config }}"
        if ($config -eq "RelWithDebInfo") {
          $config = "release"
        }
        else {
          $config = $config.ToLower()
        }

        echo "PRETTY_CONFIG=${config}" | Out-File -FilePath $env:GITHUB_ENV -Encoding UTF8 -Append

    - name: Upload game_dir with zip file name
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.MOD_ZIP_FILENAME }}_${{ env.PRETTY_CONFIG }}_${{ env.SHORT_SHA }}
        path: ${{ github.workspace }}/game_dir/**

    - name: Upload game_dir_debug with zip file name
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.MOD_ZIP_FILENAME }}_${{ env.PRETTY_CONFIG }}_${{ env.SHORT_SHA }}_pdb
        path: ${{ github.workspace }}/game_dir_debug/**

    # - name: Upload game_dir_requirements with zip file name
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: ${{ env.MOD_ZIP_FILENAME }}_${{ env.PRETTY_CONFIG }}_${{ env.SHORT_SHA }}_requirements
    #     path: ${{ github.workspace }}/game_dir_requirements/**

    # - name: Upload game_dir_requirements_debug with zip file name
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: ${{ env.MOD_ZIP_FILENAME }}_${{ env.PRETTY_CONFIG }}_${{ env.SHORT_SHA }}_requirements_pdb
    #     path: ${{ github.workspace }}/game_dir_requirements_debug/**

    - name: 'Version Badge'
      if: always()
      run: |
        mkdir badge
        echo '{"cp_version":{"label":"Cyberpunk 2077","status":"${{ env.CYBERPUNK_2077_GAME_VERSION }}","color":"${{ steps.build.outcome == 'success' && '31b75d' || 'red' }}"}}' > badge/shields.json

    - name: Push shields branch
      if: github.ref == 'refs/heads/main'
      uses: s0/git-publish-subdir-action@develop
      env:
        REPO: self
        BRANCH: shields
        FOLDER: badge
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}