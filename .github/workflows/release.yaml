name: Release Workflow

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    env:
      GIT_CLIFF_VERSION: 0.10.0
      CHANGELOG_FILE: ${{ github.workspace }}-CHANGES.md
      NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0   # git-cliff needs the full history and all tags to build the changelog
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      # the archive is packed in the build (CMAKE_CI_BUILD turns LTBF_PACK_ARCHIVE on): the WolvenKit CLI is
      # downloaded and needs nothing of the game's
      - name: Configure CMake
        run: cmake -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CI_BUILD=ON -DGITHUB_ENV="$env:GITHUB_ENV" -G Ninja

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config RelWithDebInfo

      # a release without the archive would load with no meshes, effects, HUD or sectors
      - name: Check the archive was packed
        run: |
          if (-not (Test-Path "${{ github.workspace }}/game_dir/red4ext/plugins/let_there_be_flight/let_there_be_flight.archive")) {
            Write-Error "let_there_be_flight.archive was not packed"
            exit 1
          }

      - name: Install git-cliff
        uses: Alex079/setup-custom-tool@v3
        with:
          archiveUrl: https://github.com/orhun/git-cliff/releases/download/v${{ env.GIT_CLIFF_VERSION }}/git-cliff-${{ env.GIT_CLIFF_VERSION }}-x86_64-pc-windows-msvc.zip
          archiveGlob: '*'
          toolName: git-cliff
          toolVersion: ${{ env.GIT_CLIFF_VERSION }}

      - name: Generate a changelog
        # The release body: the notes written for this version (docs/releases/vX.Y.Z.md; a prerelease tag uses its
        # version's), a link to the commits since the last full release, then the requirements. Nexus gets the notes
        # and the requirements. Only without a notes file is the body generated: every feat, fix and perf commit
        # since the last full release (git-cliff; a prerelease tag in between is not a version of its own, cliff.toml's
        # ignore_tags).
        run: |
          $tag = "${{ github.ref_name }}"
          $previous = git describe --tags --abbrev=0 --exclude "*-*" --exclude "*_*" "$tag^"
          $notes = "docs/releases/$(($tag -split '[-_]')[0]).md"
          if (Test-Path $notes) {
            Write-Host "release notes: $notes"
            $nexus = (Get-Content -Raw $notes).Trim()
            $compare = "${{ github.server_url }}/${{ github.repository }}/compare/$previous...$tag"
            $body = "$nexus`n`n[Every commit since $previous]($compare)`n"
          } else {
            Write-Host "no ${notes}: the commit list $previous..$tag is the release body"
            $commits = "${{ github.workspace }}-COMMITS.md"
            git-cliff --strip header --tag $tag "$previous..$tag" -o $commits
            $nexus = (Get-Content -Raw $commits).Trim()
            $body = "$nexus`n"
          }
          $requirements = (Get-Content -Raw requirements.md).Trim()
          Set-Content -Path "${{ env.CHANGELOG_FILE }}" -Value "$body`n$requirements" -Encoding utf8
          Set-Content -Path "${{ github.workspace }}-NEXUS.md" -Value "$nexus`n`n$requirements" -Encoding utf8
          Get-Content "${{ env.CHANGELOG_FILE }}"

      - name: Zipping game_dir
        run: tar -cvf "${{ github.workspace }}/${{ env.MOD_SLUG }}_${{ github.ref_name }}.zip" --format=zip *
        working-directory:  game_dir

      - name: Zipping game_dir_debug
        run: tar -cvf "${{ github.workspace }}/${{ env.MOD_SLUG }}_${{ github.ref_name }}_pdb.zip" --format=zip *
        working-directory:  game_dir_debug

      # - name: Check file existence
      #   id: requirements_folder_exists
      #   uses: andstor/file-existence-action@v1
      #   with:
      #     files: "game_dir_requirements"

      # - name: Check file existence
      #   id: requirements_debug_folder_exists
      #   uses: andstor/file-existence-action@v1
      #   with:
      #     files: "game_dir_requirements_debug"

      # - name: Zipping game_dir_requirements
      #   if: steps.requirements_folder_exists.outputs.files_exists == 'true'
      #   run: tar -cvf "${{ github.workspace }}/${{ env.MOD_SLUG }}_${{ github.ref_name }}_requirements.zip" --format=zip *
      #   working-directory:  game_dir_requirements

      # - name: Zipping game_dir_requirements_debug
      #   if: steps.requirements_debug_folder_exists.outputs.files_exists == 'true'
      #   run: tar -cvf "${{ github.workspace }}/${{ env.MOD_SLUG }}_${{ github.ref_name }}_requirements_pdb.zip" --format=zip *
      #   working-directory:  game_dir_requirements_debug

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}${{ env.CYBERPUNK_2077_GAME_VERSION_STR }}
          body_path: ${{ env.CHANGELOG_FILE }}
          append_body: true
          files: |
            ${{ env.MOD_SLUG }}_${{ github.ref_name }}*.zip
          prerelease: ${{ contains(github.ref_name, '-') || contains(github.ref_name, '_') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read changelog for Nexus
        id: nexus_changelog
        shell: pwsh
        run: |
          $body = Get-Content -Raw "${{ github.workspace }}-NEXUS.md"
          "changelog<<NEXUS_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append
          "NEXUS_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append
          "version=$('${{ github.ref_name }}'.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append

      # Requires repo secret NEXUSMODS_API_KEY (https://www.nexusmods.com/settings/api-keys)
      # file_id is the v3 file chain id for the main LTBF file (mod page -> Files -> Advanced / API Info); public, not a secret.
      # Skipped for prerelease tags and when the secret is not set.
      # The v3 API keys mods by a global id, not the game-scoped 5208 from the site URL; resolve it first.
      - name: Resolve Nexus Mods v3 mod id
        id: nexus_mod
        if: ${{ !(contains(github.ref_name, '-') || contains(github.ref_name, '_')) && env.NEXUSMODS_API_KEY != '' }}
        shell: pwsh
        run: |
          $r = Invoke-RestMethod -Uri "https://api.nexusmods.com/v3/games/cyberpunk2077/mods/5208" -Headers @{ apikey = $env:NEXUSMODS_API_KEY; "User-Agent" = "let_there_be_flight-release" }
          "mod_id=$($r.data.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append
          "resolved mod 5208 -> v3 id $($r.data.id)"

      - name: Upload to Nexus Mods
        if: ${{ !(contains(github.ref_name, '-') || contains(github.ref_name, '_')) && env.NEXUSMODS_API_KEY != '' }}
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ env.NEXUSMODS_API_KEY }}
          mod_id: ${{ steps.nexus_mod.outputs.mod_id }}
          file_id: 2617843
          filename: ${{ env.MOD_SLUG }}_${{ github.ref_name }}.zip
          version: ${{ steps.nexus_changelog.outputs.version }}
          display_name: Let There Be Flight ${{ github.ref_name }}${{ env.CYBERPUNK_2077_GAME_VERSION_STR }}
          category: main
          changelog: ${{ steps.nexus_changelog.outputs.changelog }}
          update_mod_version: true
          archive_existing_version: false
          primary_mod_manager_download: true
